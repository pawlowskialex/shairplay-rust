[workspace]
resolver = "3"

[workspace.package]
version = "0.13.0"

[package]
name = "shairplay"
version.workspace = true
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Pure Rust AirPlay server library"
keywords = ["airplay", "raop", "audio", "streaming", "apple"]
categories = ["multimedia::audio", "network-programming"]
readme = "README.md"
homepage = "https://github.com/metaneutrons/shairplay-rust"
repository = "https://github.com/metaneutrons/shairplay-rust"
rust-version = "1.94"
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/AP2-STATUS.md",
    "/docs/**",
    "/airport.key",
]

[dependencies]
# Async runtime
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync", "macros", "signal", "io-util", "time"] }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"

# HTTP/RTSP parsing
httparse = "1"

# Crypto
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
rsa = "0.9"
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
sha1 = "0.10" # stays on digest 0.10 until rsa 0.10 is stable: rsa 0.9 takes sha1::Sha1 as its digest type parameter
sha2 = "0.11"
md-5 = "0.11"
hmac = "0.13"
rand = "0.10"
subtle = "2" # constant-time comparison of authenticators/proofs
zeroize = "1" # pairing secrets wiped when they go

# Encoding / parsing
base64 = "0.23"
plist = "1.10.3"

# AirPlay 2 (optional)
chacha20poly1305 = { version = "0.11", optional = true }
# an AirPlay 2 packet's tag checked without decrypting it (the cipher and MAC chacha20poly1305 is made of)
chacha20 = { version = "0.10", optional = true }
poly1305 = { version = "0.9", optional = true }
hkdf = { version = "0.13", optional = true }
num-bigint = { version = "0.5", optional = true }
uuid = { version = "1.29.0", features = ["v4"], optional = true }
rubato = { version = "5", optional = true }
symphonia = { version = "0.6", optional = true, features = ["aac"] }

# Error handling
thiserror = "2.0.21"

# Logging
tracing = "0.1"
hex = "0.4"
# Interface table, to resolve an mDNS scope (already a dependency of mdns-sd)
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Networking_WinSock"] }

[target.'cfg(target_os = "macos")'.dependencies]
astro-dnssd = "0.3.8"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21.6"
gethostname = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# CLOCK_MONOTONIC for play times (util::now_ns); kernel receive timestamps for PTP Sync messages (ptp-timestamps)
nix = { version = "0.29", default-features = false, features = ["time"] }

[features]
default = ["fairplay"]
# FairPlay handshake and key decryption (`POST /fp-setup`, `a=fpaeskey`, AP2 video
# keys). Enabled by default. The code is a rewrite of a reference that upstream ships
# under the GPL-3.0, so its provenance carries some uncertainty. See
# docs/fairplay-provenance.md. Build with `default-features = false` to leave it out.
fairplay = []
pipewire-auth-setup-compat = []
resample = ["dep:rubato"]
# AirPlay 2 with symphonia's AAC decoder and resampling, as before
ap2 = ["ap2-core", "resample", "aac-symphonia"]
# AirPlay 2 protocol support without pulling in an AAC decoder or the resampler
ap2-core = ["dep:chacha20poly1305", "dep:chacha20", "dep:poly1305", "dep:hkdf", "dep:num-bigint", "dep:uuid", "dep:libc", "dep:windows-sys"]
aac-symphonia = ["dep:symphonia"]
video = ["ap2", "fairplay"]
hls = ["video"]
# the parsers' entry points for the fuzz targets (fuzz/)
fuzzing = []
# PTP Sync messages timestamped by the kernel on receipt (SO_TIMESTAMPNS, Linux) rather than when the task wakes
ptp-timestamps = ["nix/socket", "nix/uio", "nix/net"]

[dev-dependencies]
# the integration tests' own sender side (tests/support.rs)
chacha20poly1305 = "0.11"
hkdf = "0.13"
tokio = { version = "1.54.1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serial_test = "4.0.1"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

# the player example's audio and video out (desktop libraries: the tests don't need them, and a 32-bit test run
# builds without them)
[target.'cfg(target_pointer_width = "64")'.dev-dependencies]
cpal = "0.18.2"
openh264 = "0.9.9"
minifb = "0.29.0"

[[example]]
name = "player"
required-features = []

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# clippy's defaults, denied in CI (-D warnings)
