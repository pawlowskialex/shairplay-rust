[workspace]
resolver = "3"

[workspace.package]
version = "0.10.0"

[package]
name = "shairplay"
version.workspace = true
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Pure Rust AirPlay server library"
keywords = ["airplay", "raop", "audio", "streaming", "apple"]
categories = ["multimedia::audio", "network-programming"]
readme = "README.md"
homepage = "https://github.com/metaneutrons/shairplay-rust"
repository = "https://github.com/metaneutrons/shairplay-rust"
rust-version = "1.94"
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/AP2-STATUS.md",
    "/docs/**",
    "/airport.key",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "macros", "signal", "io-util", "time"] }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"

# HTTP/RTSP parsing
httparse = "1"

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rsa = "0.9"
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
rand = "0.8"
subtle = "2" # constant-time comparison of authenticators/proofs
zeroize = "1" # pairing secrets wiped when they go

# Encoding / parsing
base64 = "0.22"
plist = "1.9"

# AirPlay 2 (optional)
chacha20poly1305 = { version = "0.10", optional = true }
# an AirPlay 2 packet's tag checked without decrypting it (the cipher and MAC chacha20poly1305 is made of)
chacha20 = { version = "0.9", optional = true }
poly1305 = { version = "0.8", optional = true }
hkdf = { version = "0.12", optional = true }
num-bigint = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rubato = { version = "3", optional = true }
symphonia = { version = "0.6", optional = true, features = ["aac"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
astro-dnssd = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21"
gethostname = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# CLOCK_MONOTONIC for play times (util::now_ns); kernel receive timestamps for PTP Sync messages (ptp-timestamps)
nix = { version = "0.29", default-features = false, features = ["time"] }

[features]
default = []
pipewire-auth-setup-compat = []
resample = ["dep:rubato"]
# AirPlay 2 with symphonia's AAC decoder and resampling, as before
ap2 = ["ap2-core", "resample", "aac-symphonia"]
# AirPlay 2 protocol support without pulling in an AAC decoder or the resampler
ap2-core = ["dep:chacha20poly1305", "dep:chacha20", "dep:poly1305", "dep:hkdf", "dep:num-bigint", "dep:uuid"]
aac-symphonia = ["dep:symphonia"]
video = ["ap2"]
hls = ["video"]
# PTP Sync messages timestamped by the kernel on receipt (SO_TIMESTAMPNS, Linux) rather than when the task wakes
ptp-timestamps = ["nix/socket", "nix/uio", "nix/net"]

[dev-dependencies]
# the integration tests' own sender side (tests/support.rs)
chacha20poly1305 = "0.10"
hkdf = "0.12"
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serial_test = "3"
cpal = "0.17"
rubato = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openh264 = "0.9"
minifb = "0.28"

[[example]]
name = "player"
required-features = []

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
# clippy's defaults, denied in CI (-D warnings)
