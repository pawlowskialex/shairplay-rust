[package]
name = "shairplay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# fuzz_plist exercises the same `plist` crate API the server uses on request bodies.
plist = "1"

[dependencies.shairplay]
path = ".."
features = ["fuzzing", "ap2"]

[workspace]
members = ["."]

[[bin]]
name = "fuzz_http"
path = "fuzz_targets/fuzz_http.rs"
doc = false

[[bin]]
name = "fuzz_sdp"
path = "fuzz_targets/fuzz_sdp.rs"
doc = false

[[bin]]
name = "fuzz_plist"
path = "fuzz_targets/fuzz_plist.rs"
doc = false

[[bin]]
name = "fuzz_rtp"
path = "fuzz_targets/fuzz_rtp.rs"
doc = false

[[bin]]
name = "fuzz_dmap"
path = "fuzz_targets/fuzz_dmap.rs"
doc = false

[[bin]]
name = "fuzz_tlv"
path = "fuzz_targets/fuzz_tlv.rs"
doc = false
